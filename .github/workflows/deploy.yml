name: Deploy a VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dddtech2/grupo_crear  # GHCR exige minúsculas
  CONTAINER: grupocrear
  # Puerto local del VPS (solo 127.0.0.1). Cámbialo con la variable de repo APP_PORT si choca con otro sitio.
  APP_PORT: ${{ vars.APP_PORT || '4321' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,GEMINI_API_KEY,IMAGE_TAG,CONTAINER,APP_PORT
          script_stop: true
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE_TAG"
            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d --name "$CONTAINER" --restart unless-stopped \
              -p 127.0.0.1:${APP_PORT}:4321 \
              -e GEMINI_API_KEY="$GEMINI_API_KEY" \
              "$IMAGE_TAG"
            docker logout ghcr.io
            # Health check
            for i in $(seq 1 15); do
              if curl -fsS -o /dev/null "http://127.0.0.1:${APP_PORT}/"; then
                echo "OK: grupocrear responde en :${APP_PORT}"; docker image prune -f; exit 0
              fi
              sleep 2
            done
            echo "La app no respondió"; docker logs --tail 50 "$CONTAINER"; exit 1
