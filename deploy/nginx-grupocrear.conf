# /etc/nginx/sites-available/grupocrear.co
# Archivo NUEVO e independiente: no modifica los otros sitios del VPS.
# Tras enlazarlo, certbot --nginx añade el bloque HTTPS automáticamente.
server {
    listen 80;
    listen [::]:80;
    server_name grupocrear.co www.grupocrear.co;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4321;   # = APP_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
